<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <form>
      <label for="roll_no">Roll No:</label>
      <input type="text" id="roll_no" name="roll_no" required /><br /><br />

      <label for="std_name">Student Name:</label>
      <input type="text" id="std_name" name="std_name" required /><br /><br />

      <label for="father_name">Father's Name:</label>
      <input
        type="text"
        id="father_name"
        name="father_name"
        required
      /><br /><br />

      <label for="dob">Date of Birth:</label>
      <input type="date" id="dob" name="dob" required /><br /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      /><br /><br />

      <label for="gender">Gender:</label>
      <input type="radio" id="gender" name="gender" value="Male" required />
      <label for="gender">Male</label>
      <input type="radio" id="gender" name="gender" value="Female" required />
      <label for="gender">Female</label><br /><br />

      <label for="depa">Department:</label>
      <select id="depa" name="depa" required>
        <option value="CS">CSE</option>
        <option value="IT">IT</option>
      </select>
      <br /><br />

      <label for="photo">Student Photo:</label>
      <input type="file" id="photo" name="photo" required />
      <br /><br />

      <label for="city">City:</label>
      <input type="text" id="city" name="city" required />
      <br /><br />

      <label for="address">Address:</label>
      <input type="text" id="address" name="address" required />
      <br /><br />

      <input type="submit" value="Register" />
    </form>
  </body>
</html>
